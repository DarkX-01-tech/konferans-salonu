<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konuşmacı Ekranı</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; overflow: hidden; }

  .top { background: #1e293b; border-bottom: 3px solid #2563eb; padding: 14px 28px; text-align: center; }
  .top .baslik { font-size: 0.85rem; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }

  .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 20px; }
  .konu { font-size: clamp(1.2rem, 2.5vw, 2rem); color: #93c5fd; text-align: center; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .konusmaci { font-size: clamp(2rem, 4vw, 3.8rem); font-weight: 800; text-align: center; color: #f8fafc; }

  .duyuru { background: #7c3aed; color: #fff; border-radius: 12px; padding: 16px 28px; font-size: clamp(1rem, 2vw, 1.5rem); text-align: center; font-weight: 700; width: 100%; max-width: 800px; display: none; }
  .duyuru.aktif { display: block; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(124,58,237,.5); } 50% { box-shadow: 0 0 0 16px rgba(124,58,237,0); } }

  .bottom { background: #1e293b; padding: 16px; text-align: center; }
  .sayac-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
  .sayac { font-size: 2.2rem; font-weight: 700; color: #4ade80; letter-spacing: 4px; font-family: monospace; }
</style>
</head>
<body>

<div class="top">
  <div class="baslik">Konuşmacı Ekranı</div>
</div>

<div class="main">
  <div class="konu" id="konu"></div>
  <div class="konusmaci" id="konusmaci"></div>
  <div class="duyuru" id="duyuru"></div>
</div>

<div class="bottom">
  <div class="sayac-label">GEÇEN SÜRE</div>
  <div class="sayac" id="sayac">00:00</div>
</div>

<script>
  const startTime = Date.now();
  setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('sayac').textContent = m + ':' + s;
  }, 1000);

  function applyState(s) {
    document.getElementById('konu').textContent = s.konu || '';
    document.getElementById('konusmaci').textContent = s.konusmaci || '';
    const duyuruEl = document.getElementById('duyuru');
    duyuruEl.textContent = s.duyuru || '';
    duyuruEl.className = 'duyuru' + (s.duyuru ? ' aktif' : '');
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => applyState(JSON.parse(e.data));
  ws.onclose = () => setTimeout(() => location.reload(), 3000);
</script>
</body>
</html>
