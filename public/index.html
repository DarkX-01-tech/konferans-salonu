<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kürsü Monitörü</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; color: #fff; font-family: 'Segoe UI', sans-serif; }

  /* HEADER */
  .header { display: flex; align-items: center; gap: 20px; background: #1e293b; padding: 16px 32px; border-bottom: 3px solid #2563eb; }
  .header img { height: 64px; object-fit: contain; }
  .header img.hidden { display: none; }
  .header-text { display: flex; flex-direction: column; gap: 2px; }
  .header-text .line1 { font-size: 1rem; font-weight: 700; color: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
  .header-text .line2 { font-size: 1.1rem; font-weight: 700; color: #cbd5e1; }
  .header-text .line3 { font-size: 0.9rem; color: #94a3b8; }

  /* MAIN */
  .main { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 130px); padding: 30px; }
  .konu { font-size: clamp(1.4rem, 3vw, 2.4rem); color: #93c5fd; text-align: center; font-weight: 600; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 1px; min-height: 1em; }
  .konusmaci { font-size: clamp(2.2rem, 5vw, 4.5rem); font-weight: 800; text-align: center; color: #f8fafc; text-shadow: 0 0 40px rgba(99,102,241,.5); min-height: 1em; }

  /* FOOTER */
  .footer { position: fixed; bottom: 0; left: 0; right: 0; background: #b91c1c; height: 50px; overflow: hidden; display: flex; align-items: center; }
  .ticker-wrap { overflow: hidden; width: 100%; }
  .ticker { display: inline-block; white-space: nowrap; animation: ticker-move 30s linear infinite; font-size: 1.15rem; font-weight: 600; color: #fff; padding-left: 100%; }
  @keyframes ticker-move { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
  .ticker .sep { margin: 0 40px; color: #fca5a5; }
</style>
</head>
<body>

<div class="header">
  <img id="logo" src="/logo.png" alt="Logo" onerror="this.classList.add('hidden')">
  <div class="header-text">
    <div class="line1">T.C. SAĞLIK BAKANLIĞI</div>
    <div class="line2">İSTANBUL İL SAĞLIK MÜDÜRLÜĞÜ</div>
    <div class="line3">Marmara Üniversitesi Pendik Eğitim ve Araştırma Hastanesi</div>
  </div>
</div>

<div class="main">
  <div class="konu" id="konu"></div>
  <div class="konusmaci" id="konusmaci"></div>
</div>

<div class="footer">
  <div class="ticker-wrap">
    <div class="ticker" id="ticker">&nbsp;</div>
  </div>
</div>

<script>
  function applyState(s) {
    document.getElementById('konu').textContent = s.konu || '';
    document.getElementById('konusmaci').textContent = s.konusmaci || '';
    const parts = [];
    if (s.sempozyum) parts.push(s.sempozyum);
    if (s.duyuru) parts.push(s.duyuru);
    const ticker = document.getElementById('ticker');
    ticker.innerHTML = '';
    if (parts.length) {
      parts.forEach((p, i) => {
        if (i > 0) {
          const sep = document.createElement('span');
          sep.className = 'sep';
          sep.textContent = '◆';
          ticker.appendChild(sep);
        }
        const span = document.createElement('span');
        span.textContent = p;
        ticker.appendChild(span);
      });
    } else {
      ticker.innerHTML = '&nbsp;';
    }
  }

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}`);
  ws.onmessage = e => applyState(JSON.parse(e.data));
  ws.onclose = () => setTimeout(() => location.reload(), 3000);
</script>
</body>
</html>
