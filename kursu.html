<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konferans Salonu – Kürsü Ekranı</title>
  <style>
    /* ── Renk değişkenleri ─────────────────────────────────── */
    :root {
      --red:      #cc2029;
      --red-dark: #b11622;
      --text:     #1b2736;
      --muted:    #4c5b6c;
      --bg:       #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ── Üst başlık ────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 18px 28px 14px;
      border-bottom: 1px solid #ebedf2;
      flex-shrink: 0;
    }

    /* Logo: geniş oranlı görsel – genişlik bazlı, yükseklik serbest */
    .logo {
      max-width: 480px;
      width: clamp(200px, 35vw, 480px);
      height: auto;
      max-height: 90px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    /* Sağ üst köşe: saat + tarih */
    .clock-wrap {
      text-align: right;
      flex: 0 0 auto;
      line-height: 1.2;
    }
    .clock-time {
      font-size: clamp(22px, 2.2vw, 38px);
      font-weight: 800;
      color: var(--text);
    }
    .clock-date {
      font-size: clamp(13px, 1.2vw, 20px);
      color: var(--muted);
      font-weight: 600;
    }

    /* ── Orta alan ─────────────────────────────────────────── */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 40px;
    }

    /* Glassmorphism cam kart */
    .content {
      max-width: min(1400px, 92vw);
      width: 100%;
      padding: clamp(28px, 4vw, 64px) clamp(24px, 5vw, 72px);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 26px;
      box-shadow: 0 18px 50px rgba(20, 32, 62, 0.14);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
    }

    /* Sempozyum / etkinlik adı – üst */
    .symposium {
      margin: 0 0 18px;
      font-size: clamp(24px, 2.6vw, 46px);
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* Ayırıcı ince çizgi */
    .divider {
      border: none;
      border-top: 2px solid rgba(120, 130, 150, .3);
      margin: 16px auto;
      width: 55%;
    }

    /* Konu – orta, kırmızı */
    .topic {
      margin: 0 0 18px;
      font-size: clamp(30px, 3.6vw, 64px);
      font-weight: 800;
      color: var(--red);
      text-transform: uppercase;
      line-height: 1.15;
    }

    /* Konuşmacı – alt, en büyük */
    .speaker {
      margin: 0;
      font-size: clamp(40px, 5.5vw, 96px);
      font-weight: 900;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1.05;
    }

    /* ── Bekleme modu ──────────────────────────────────────── */
    .waiting {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 40px;
      flex: 1;
    }

    .waiting-text {
      font-size: clamp(40px, 6vw, 110px);
      font-weight: 800;
      color: var(--muted);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    /* ── Alt kırmızı bant ──────────────────────────────────── */
    .bottom {
      background: var(--red);
      color: #fff;
      height: 80px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-top: 4px solid var(--red-dark);
      flex-shrink: 0;
    }

    .marquee {
      display: inline-block;
      white-space: nowrap;
      transform: translateX(100vw);
      animation: ticker 24s linear infinite;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: 700;
      padding-left: 20px;
    }

    @keyframes ticker {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>

  <!-- Üst başlık: logo + saat -->
  <header class="header">
    <img id="logo" class="logo" src="img/hastane.png" alt="Hastane Logosu"
         onerror="this.style.display='none'" />
    <div class="clock-wrap">
      <div class="clock-time" id="clockTime">--:--</div>
      <div class="clock-date" id="clockDate"></div>
    </div>
  </header>

  <!-- Bekleme modu (veri yokken görünür) -->
  <div class="waiting" id="waitingEl">
    <div class="waiting-text">Yayın Bekleniyor…</div>
  </div>

  <!-- Yayın içeriği (veri gelince görünür) -->
  <main class="center" id="contentEl" style="display:none;">
    <div class="content">
      <div id="symposiumEl" class="symposium"></div>
      <hr class="divider" id="divTop" />
      <h1 id="topicEl" class="topic"></h1>
      <hr class="divider" id="divBot" />
      <h2 id="speakerEl" class="speaker"></h2>
    </div>
  </main>

  <!-- Alt kayan bant -->
  <footer class="bottom">
    <div id="marqueeEl" class="marquee"></div>
  </footer>

  <script>
    (function () {
      /* ── Sabitler ─────────────────────────────────────────── */
      var STORAGE_KEY  = "konferans_state";
      var CHANNEL_NAME = "konferans_channel";
      var DEFAULT_TICKER =
        "S.B. Marmara Üniversitesi Pendik Eğitim ve Araştırma Hastanesi" +
        " \u2502 Prof. Dr. Işıl Barlan Konferans Salonu";

      var defaultState = { speaker: "", symposium: "", topic: "", ticker: "" };

      /* ── DOM referansları ────────────────────────────────── */
      var waitingEl  = document.getElementById("waitingEl");
      var contentEl  = document.getElementById("contentEl");
      var symposiumEl = document.getElementById("symposiumEl");
      var topicEl    = document.getElementById("topicEl");
      var speakerEl  = document.getElementById("speakerEl");
      var marqueeEl  = document.getElementById("marqueeEl");
      var divTop     = document.getElementById("divTop");
      var divBot     = document.getElementById("divBot");

      /* ── localStorage okuma ──────────────────────────────── */
      function readState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return Object.assign({}, defaultState);
          return Object.assign({}, defaultState, JSON.parse(raw));
        } catch (_) {
          return Object.assign({}, defaultState);
        }
      }

      /* ── Ekranı güncelle ─────────────────────────────────── */
      function render(state) {
        var hasSpeaker   = !!state.speaker;
        var hasTopic     = !!state.topic;
        var hasSymposium = !!state.symposium;
        var hasContent   = hasSpeaker || hasTopic || hasSymposium;

        /* Bekleme ↔ içerik gösterimi */
        waitingEl.style.display  = hasContent ? "none"  : "flex";
        contentEl.style.display  = hasContent ? "flex"  : "none";

        /* Metinler (XSS güvenliği: textContent) */
        symposiumEl.textContent = state.symposium || "";
        topicEl.textContent     = state.topic     || "";
        speakerEl.textContent   = state.speaker   || "";

        /* Sempozyum ve ayırıcılar: içerik yoksa gizle */
        symposiumEl.style.display = hasSymposium ? "" : "none";
        divTop.style.display      = hasSymposium ? "" : "none";
        divBot.style.display      = (hasTopic && hasSpeaker) ? "" : "none";

        /* Alt bant: SADECE duyuru (ticker); yoksa kurumsal varsayılan metin.
           NOT: Sempozyum adı alt banta EKLENMEZ. */
        marqueeEl.textContent = state.ticker || DEFAULT_TICKER;

        /* Animasyonu sıfırla (kaydırma yeniden başlasın) */
        marqueeEl.style.animation = "none";
        void marqueeEl.offsetWidth;
        marqueeEl.style.animation = "";
      }

      /* ── Canlı saat ──────────────────────────────────────── */
      var clockTimeEl = document.getElementById("clockTime");
      var clockDateEl = document.getElementById("clockDate");
      var TR_DAYS   = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
      var TR_MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
                       "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

      function updateClock() {
        var now = new Date();
        var hh = String(now.getHours()).padStart(2, "0");
        var mm = String(now.getMinutes()).padStart(2, "0");
        var ss = String(now.getSeconds()).padStart(2, "0");
        clockTimeEl.textContent = hh + ":" + mm + ":" + ss;
        clockDateEl.textContent =
          TR_DAYS[now.getDay()] + ", " +
          now.getDate() + " " +
          TR_MONTHS[now.getMonth()] + " " +
          now.getFullYear();
      }
      updateClock();
      setInterval(updateClock, 1000);

      /* ── İlk render ──────────────────────────────────────── */
      render(readState());

      /* ── BroadcastChannel dinle ───────────────────────────── */
      if ("BroadcastChannel" in window) {
        var ch = new BroadcastChannel(CHANNEL_NAME);
        ch.addEventListener("message", function (ev) {
          if (!ev.data || ev.data.type !== "state_update") return;
          render(Object.assign({}, defaultState, ev.data.payload));
        });
      }

      /* ── localStorage değişikliği (farklı sekme) ──────────── */
      window.addEventListener("storage", function (ev) {
        if (ev.key !== STORAGE_KEY) return;
        render(readState());
      });

    })();
  </script>
</body>
</html>
