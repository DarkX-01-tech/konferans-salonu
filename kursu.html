<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konferans Salonu – Kürsü Ekranı</title>
  <style>
    /* ── Renk değişkenleri ─────────────────────────────────── */
    :root {
      --red:      #cc2029;
      --red-dark: #b11622;
      --text:     #1b2736;
      --muted:    #4c5b6c;
      --bg:       #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 85% -10%, #e3ecfb 0%, rgba(227,236,251,0) 60%),
        radial-gradient(900px 500px at 0% 110%, #ecf1fb 0%, rgba(236,241,251,0) 55%),
        linear-gradient(180deg, #f7f9ff 0%, #ffffff 100%);
      display: flex;
      flex-direction: column;
    }

    /* ── Üst başlık ────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 18px 28px 14px;
      border-bottom: 1px solid #ebedf2;
      flex-shrink: 0;
    }

    /* Logo: geniş oranlı görsel – genişlik bazlı, yükseklik serbest */
    .logo {
      max-width: 480px;
      width: clamp(200px, 35vw, 480px);
      height: auto;
      max-height: 90px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    /* Sağ üst köşe: saat + tarih — belirgin GLASS kart */
    .clock-wrap {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      padding: 14px 24px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.38), rgba(255,255,255,0.18));
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow:
        0 10px 30px rgba(20, 32, 62, 0.16),
        inset 0 1px 0 rgba(255,255,255,0.9);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      backdrop-filter: blur(18px) saturate(160%);
    }
    .clock-time {
      font-size: clamp(28px, 2.8vw, 50px);
      font-weight: 900;
      color: var(--text);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      display: flex;
      align-items: baseline;
      gap: 6px;
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }
    .clock-seconds {
      font-size: clamp(15px, 1.4vw, 24px);
      font-weight: 800;
      color: var(--red);
    }
    .clock-date {
      font-size: clamp(12px, 1.1vw, 18px);
      color: var(--muted);
      font-weight: 700;
      text-transform: capitalize;
    }

    /* ── Orta alan ─────────────────────────────────────────── */
    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 40px;
    }

    /* Glassmorphism cam kart — konuşmacı adına göre yatayda genişler */
    .content {
      display: inline-block;
      width: max-content;
      max-width: 96vw;
      padding: clamp(28px, 4vw, 64px) clamp(32px, 5vw, 80px);
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 26px;
      box-shadow: 0 18px 50px rgba(20, 32, 62, 0.14);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      backdrop-filter: blur(14px) saturate(140%);
    }

    /* Sempozyum / etkinlik adı – üst */
    .symposium {
      margin: 0 0 18px;
      font-size: clamp(24px, 2.6vw, 46px);
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    /* Ayırıcı ince çizgi */
    .divider {
      border: none;
      border-top: 2px solid rgba(120, 130, 150, .3);
      margin: 16px auto;
      width: 55%;
    }

    /* Konu – orta, kırmızı */
    .topic {
      margin: 0 0 18px;
      font-size: clamp(30px, 3.6vw, 64px);
      font-weight: 800;
      color: var(--red);
      text-transform: uppercase;
      line-height: 1.15;
    }

    /* Konuşmacı – alt, en büyük, TEK SATIR (kırılmaz) */
    .speaker {
      margin: 0;
      font-size: clamp(40px, 5.5vw, 96px);
      font-weight: 900;
      color: var(--text);
      text-transform: uppercase;
      line-height: 1.05;
      white-space: nowrap;
    }

    /* ── Bekleme modu ──────────────────────────────────────── */
    .waiting {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 28px 40px;
      flex: 1;
    }

    .waiting-text {
      font-size: clamp(40px, 6vw, 110px);
      font-weight: 800;
      color: var(--muted);
      animation: pulse 2.4s ease-in-out infinite;
      max-width: 92vw;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .35; }
    }

    /* ── Alt kırmızı bant ──────────────────────────────────── */
    .bottom {
      background: var(--red);
      color: #fff;
      height: 80px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-top: 4px solid var(--red-dark);
      flex-shrink: 0;
    }

    .marquee {
      display: inline-block;
      white-space: nowrap;
      transform: translateX(100vw);
      animation: ticker 24s linear infinite;
      font-size: clamp(20px, 2vw, 34px);
      font-weight: 700;
      padding-left: 20px;
    }

    @keyframes ticker {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    /* ── Tam ekran geçiş katmanı (yönetici komutu sonrası) ─── */
    #fsOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 32, 62, 0.35);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      cursor: pointer;
    }
    #fsOverlay.show { display: flex; }
    .fs-box {
      background: rgba(255,255,255,0.85);
      border: 1.5px solid rgba(255,255,255,0.95);
      border-radius: 22px;
      padding: 34px 54px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(20,32,62,0.3);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    .fs-box .fs-icon { font-size: 54px; line-height: 1; }
    .fs-box .fs-text { margin-top: 12px; font-size: 22px; font-weight: 800; color: var(--text); }
    .fs-box .fs-sub  { margin-top: 4px; font-size: 15px; color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>

  <!-- Üst başlık: logo + saat -->
  <header class="header">
    <img id="logo" class="logo" src="img/hastane.png" alt="Hastane Logosu"
         onerror="this.style.display='none'" />
    <div class="clock-wrap">
      <div class="clock-time" id="clockTime">
        <span id="clockHM">--:--</span><span class="clock-seconds" id="clockSec">00</span>
      </div>
      <div class="clock-date" id="clockDate"></div>
    </div>
  </header>

  <!-- Bekleme modu (veri yokken görünür) -->
  <div class="waiting" id="waitingEl">
    <div class="waiting-text" id="waitingText">Yayın Bekleniyor…</div>
  </div>

  <!-- Yayın içeriği (veri gelince görünür) -->
  <main class="center" id="contentEl" style="display:none;">
    <div class="content">
      <div id="symposiumEl" class="symposium"></div>
      <hr class="divider" id="divTop" />
      <h1 id="topicEl" class="topic"></h1>
      <hr class="divider" id="divBot" />
      <h2 id="speakerEl" class="speaker"></h2>
    </div>
  </main>

  <!-- Alt kayan bant -->
  <footer class="bottom">
    <div id="marqueeEl" class="marquee"></div>
  </footer>

  <!-- Tam ekran geçiş katmanı: yönetici komutu gelince belirir, tıklayınca tam ekran -->
  <div id="fsOverlay" title="Tam ekrana geçmek için tıklayın">
    <div class="fs-box">
      <div class="fs-icon">⛶</div>
      <div class="fs-text" id="fsText">Tam Ekrana Geç</div>
      <div class="fs-sub">Devam etmek için ekrana tıklayın</div>
    </div>
  </div>

  <script>
    (function () {
      /* ── Sabitler ─────────────────────────────────────────── */
      var STORAGE_KEY  = "konferans_state";
      var CHANNEL_NAME = "konferans_channel";
      var DEFAULT_TICKER =
        "S.B. Marmara Üniversitesi Pendik Eğitim ve Araştırma Hastanesi" +
        " \u2502 Prof. Dr. Işıl Barlan Konferans Salonu";
      var DEFAULT_WAITING = "Yayın Bekleniyor…";

      /* waiting: bekleme modunda gösterilecek özel mesaj (ör. "Toplantıya 15 Dakika Ara") */
      var defaultState = { speaker: "", symposium: "", topic: "", ticker: "", waiting: "" };

      /* ── DOM referansları ────────────────────────────────── */
      var waitingEl   = document.getElementById("waitingEl");
      var waitingText = document.getElementById("waitingText");
      var contentEl   = document.getElementById("contentEl");
      var symposiumEl = document.getElementById("symposiumEl");
      var topicEl     = document.getElementById("topicEl");
      var speakerEl   = document.getElementById("speakerEl");
      var marqueeEl   = document.getElementById("marqueeEl");
      var divTop      = document.getElementById("divTop");
      var divBot      = document.getElementById("divBot");

      /* ── localStorage okuma ──────────────────────────────── */
      function readState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return Object.assign({}, defaultState);
          return Object.assign({}, defaultState, JSON.parse(raw));
        } catch (_) {
          return Object.assign({}, defaultState);
        }
      }

      /* ── Konuşmacı adını çerçeveye sığdır (tek satır) ─────── */
      function fitSpeaker() {
        if (!speakerEl.textContent) return;
        speakerEl.style.fontSize = "";      /* clamp değerine dön */
        var maxW = window.innerWidth * 0.90; /* ekranın %90'ı */
        var size = parseFloat(getComputedStyle(speakerEl).fontSize);
        var guard = 0;
        while (speakerEl.scrollWidth > maxW && size > 24 && guard < 200) {
          size -= 2;
          speakerEl.style.fontSize = size + "px";
          guard++;
        }
      }

      /* ── Ekranı güncelle ─────────────────────────────────── */
      function render(state) {
        var hasSpeaker   = !!state.speaker;
        var hasTopic     = !!state.topic;
        var hasSymposium = !!state.symposium;
        var hasContent   = hasSpeaker || hasTopic || hasSymposium;

        waitingEl.style.display  = hasContent ? "none"  : "flex";
        contentEl.style.display  = hasContent ? "flex"  : "none";

        waitingText.textContent = state.waiting || DEFAULT_WAITING;

        symposiumEl.textContent = state.symposium || "";
        topicEl.textContent     = state.topic     || "";
        speakerEl.textContent   = state.speaker   || "";

        symposiumEl.style.display = hasSymposium ? "" : "none";
        divTop.style.display      = hasSymposium ? "" : "none";
        divBot.style.display      = (hasTopic && hasSpeaker) ? "" : "none";

        if (hasSpeaker) fitSpeaker();

        /* Alt bant: SADECE duyuru; yoksa kurumsal varsayılan. Sempozyum EKLENMEZ. */
        marqueeEl.textContent = state.ticker || DEFAULT_TICKER;

        marqueeEl.style.animation = "none";
        void marqueeEl.offsetWidth;
        marqueeEl.style.animation = "";
      }

      window.addEventListener("resize", fitSpeaker);

      /* ── Canlı saat ──────────────────────────────────────── */
      var clockHM  = document.getElementById("clockHM");
      var clockSec = document.getElementById("clockSec");
      var clockDateEl = document.getElementById("clockDate");
      var TR_DAYS   = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
      var TR_MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran",
                       "Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

      function updateClock() {
        var now = new Date();
        var hh = String(now.getHours()).padStart(2, "0");
        var mm = String(now.getMinutes()).padStart(2, "0");
        var ss = String(now.getSeconds()).padStart(2, "0");
        clockHM.textContent  = hh + ":" + mm;
        clockSec.textContent = ss;
        clockDateEl.textContent =
          TR_DAYS[now.getDay()] + ", " +
          now.getDate() + " " +
          TR_MONTHS[now.getMonth()] + " " +
          now.getFullYear();
      }
      updateClock();
      setInterval(updateClock, 1000);

      /* ── İlk render ──────────────────────────────────────── */
      render(readState());

      /* ── Tam ekran ────────────────────────────────────────── */
      var fsOverlay = document.getElementById("fsOverlay");
      var fsText    = document.getElementById("fsText");

      function enterFullscreen() {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      }
      function exitFullscreen() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }

      /* Yönetici komutu gelince: doğrudan tam ekran denenir; tarayıcı
         kullanıcı jesti isterse ekranda tıklanabilir katman gösterilir. */
      function requestFullscreenFromAdmin() {
        if (document.fullscreenElement) { exitFullscreen(); return; }
        /* Önce doğrudan dene (bazı tarayıcı/politikalarda çalışır) */
        try { enterFullscreen(); } catch (_) {}
        /* Kısa süre sonra hâlâ tam ekran değilse katmanı göster */
        setTimeout(function () {
          if (!document.fullscreenElement) {
            fsText.textContent = "Tam Ekrana Geç";
            fsOverlay.classList.add("show");
          }
        }, 250);
      }

      /* Katmana tıklayınca tam ekrana geç (bu gerçek kullanıcı jestidir) */
      fsOverlay.addEventListener("click", function () {
        enterFullscreen();
        fsOverlay.classList.remove("show");
      });

      /* Çift tıkla veya F tuşu ile de tam ekran/çıkış (yedek) */
      document.addEventListener("dblclick", function () {
        if (document.fullscreenElement) exitFullscreen(); else enterFullscreen();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "f" || e.key === "F") {
          if (document.fullscreenElement) exitFullscreen(); else enterFullscreen();
        }
        if (e.key === "Escape") fsOverlay.classList.remove("show");
      });

      /* ── BroadcastChannel dinle ───────────────────────────── */
      if ("BroadcastChannel" in window) {
        var ch = new BroadcastChannel(CHANNEL_NAME);
        ch.addEventListener("message", function (ev) {
          if (!ev.data) return;
          if (ev.data.type === "state_update") {
            render(Object.assign({}, defaultState, ev.data.payload));
          }
          if (ev.data.type === "toggle_fullscreen") {
            requestFullscreenFromAdmin();
          }
        });
      }

      /* ── localStorage değişikliği (farklı sekme) ──────────── */
      window.addEventListener("storage", function (ev) {
        if (ev.key !== STORAGE_KEY) return;
        render(readState());
      });

    })();
  </script>
</body>
</html>
