<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Konferans Salonu - Kürsü Ekranı</title>
  <style>
    :root {
      --red: #cc2029;
      --red-dark: #b11622;
      --line: rgba(204, 32, 41, 0.28);
      --text: #1b2736;
      --muted: #4c5b6c;
      --navy: #161f2c;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 24px 132px 16px 30px;
      border-bottom: 1px solid #ebedf2;
      position: relative;
    }

    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .titles {
      line-height: 1.3;
    }

    .titles .line1 {
      font-size: clamp(22px, 2.4vw, 42px);
      font-weight: 800;
      letter-spacing: .4px;
    }

    .titles .line2,
    .titles .line3 {
      font-size: clamp(18px, 1.7vw, 30px);
      color: var(--muted);
      font-weight: 700;
    }

    .fullscreen-btn {
      position: absolute;
      top: 24px;
      right: 30px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--navy);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(22, 31, 44, 0.18);
    }

    .center {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: clamp(34px, 5.5vh, 78px) clamp(24px, 6vw, 92px) 24px;
    }

    .content {
      width: min(1050px, 100%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .35s ease, transform .35s ease;
    }

    .content.is-updating {
      opacity: .35;
      transform: translateY(10px);
    }

    .content.is-empty .topic,
    .content.is-empty .separator,
    .content.is-empty .speaker-accent {
      display: none;
    }

    .content.is-empty .speaker {
      font-size: clamp(30px, 4.6vw, 58px);
      font-weight: 700;
      color: #93a0af;
      text-transform: none;
    }

    .topic {
      margin: 0;
      max-width: min(900px, 100%);
      font-size: clamp(28px, 3.5vw, 60px);
      font-weight: 800;
      text-transform: uppercase;
      color: var(--red);
      letter-spacing: .08em;
      line-height: 1.18;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .topic.compact {
      font-size: clamp(24px, 3vw, 48px);
    }

    .topic.xcompact {
      font-size: clamp(20px, 2.5vw, 40px);
    }

    .separator {
      width: min(180px, 30vw);
      height: 4px;
      margin: 22px 0 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--red) 0%, var(--line) 100%);
    }

    .speaker {
      margin: 0;
      max-width: min(980px, 100%);
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 900;
      color: var(--navy);
      text-transform: uppercase;
      line-height: .98;
      letter-spacing: .03em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .speaker.compact {
      font-size: clamp(42px, 6.8vw, 98px);
    }

    .speaker.xcompact {
      font-size: clamp(36px, 5.8vw, 82px);
      line-height: 1.04;
    }

    .speaker-accent {
      width: min(240px, 36vw);
      height: 7px;
      margin-top: 22px;
      border-radius: 999px;
      background: var(--red-dark);
    }

    .bottom {
      background: var(--red);
      color: #fff;
      height: 86px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border-top: 4px solid #b11622;
    }

    .marquee {
      display: inline-block;
      white-space: nowrap;
      transform: translateX(100vw);
      animation: ticker 22s linear infinite;
      font-size: clamp(22px, 2vw, 34px);
      font-weight: 700;
    }

    @keyframes ticker {
      0% { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }

    @media (max-width: 820px) {
      .header {
        gap: 16px;
        padding: 20px 20px 14px;
        align-items: flex-start;
      }

      .logo {
        width: 84px;
        height: 84px;
      }

      .fullscreen-btn {
        top: 18px;
        right: 20px;
        padding: 10px 14px;
        font-size: 13px;
      }

      .titles {
        padding-right: 104px;
      }

      .center {
        padding: 30px 20px 24px;
      }

      .separator {
        margin: 18px 0 22px;
      }
    }

    @media (max-width: 560px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        padding-right: 20px;
      }

      .fullscreen-btn {
        position: static;
        margin-top: 4px;
      }

      .titles {
        padding-right: 0;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <img id="logo" class="logo" src="img/hastane.png" alt="Hastane Logosu" onerror="this.style.display='none'" />
    <div class="titles">
      <div class="line1">T.C. SAĞLIK BAKANLIĞI</div>
      <div class="line2">İSTANBUL İL SAĞLIK MÜDÜRLÜĞÜ</div>
      <div class="line3">Marmara Üniversitesi Pendik Eğitim ve Araştırma Hastanesi</div>
    </div>
    <button id="fullscreenBtn" class="fullscreen-btn" type="button">Tam Ekran</button>
  </header>

  <main class="center">
    <div id="content" class="content">
      <h1 id="topic" class="topic"></h1>
      <div id="separator" class="separator" aria-hidden="true"></div>
      <h2 id="speaker" class="speaker"></h2>
      <div id="speakerAccent" class="speaker-accent" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="bottom">
    <div id="marquee" class="marquee"></div>
  </footer>

  <script>
    (function () {
      const STORAGE_STATE_KEY = "konferans_state";
      const CHANNEL_NAME = "konferans_channel";

      const defaultState = {
        speaker: "",
        symposium: "",
        topic: "",
        ticker: ""
      };

      const topicEl = document.getElementById("topic");
      const speakerEl = document.getElementById("speaker");
      const marqueeEl = document.getElementById("marquee");
      const contentEl = document.getElementById("content");
      const separatorEl = document.getElementById("separator");
      const speakerAccentEl = document.getElementById("speakerAccent");
      const fullscreenBtn = document.getElementById("fullscreenBtn");
      let renderTimer = 0;

      function applyLengthClasses(element, value, compactAt, xcompactAt) {
        element.classList.remove("compact", "xcompact");
        if (value.length >= xcompactAt) {
          element.classList.add("xcompact");
          return;
        }
        if (value.length >= compactAt) {
          element.classList.add("compact");
        }
      }

      function readState() {
        try {
          const raw = localStorage.getItem(STORAGE_STATE_KEY);
          if (!raw) return { ...defaultState };
          return { ...defaultState, ...JSON.parse(raw) };
        } catch (_) {
          return { ...defaultState };
        }
      }

      function updateContentState(state) {
        const topic = (state.topic || "").trim();
        const speaker = (state.speaker || "").trim();
        const isEmpty = !topic && !speaker;
        const showDetails = !!topic && !!speaker;

        topicEl.textContent = topic;
        speakerEl.textContent = speaker || "Yayın bekleniyor";

        applyLengthClasses(topicEl, topic, 42, 76);
        applyLengthClasses(speakerEl, speaker, 24, 40);

        contentEl.classList.toggle("is-empty", isEmpty);
        separatorEl.style.display = showDetails ? "" : "none";
        speakerAccentEl.style.display = speaker ? "" : "none";
      }

      function render(state) {
        window.clearTimeout(renderTimer);
        contentEl.classList.add("is-updating");
        renderTimer = window.setTimeout(function () {
          updateContentState(state);
          contentEl.classList.remove("is-updating");
        }, 80);

        const barText = [state.symposium, state.ticker].filter(Boolean).join(" / ");
        marqueeEl.textContent = barText || "";
        marqueeEl.style.animation = "none";
        void marqueeEl.offsetWidth;
        marqueeEl.style.animation = "";
      }

      render(readState());

      if ("BroadcastChannel" in window) {
        const channel = new BroadcastChannel(CHANNEL_NAME);
        channel.addEventListener("message", function (event) {
          if (!event.data || event.data.type !== "state_update") return;
          render({ ...defaultState, ...event.data.payload });
        });
      }

      fullscreenBtn.addEventListener("click", function () {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function () {});
          return;
        }
        document.exitFullscreen().catch(function () {});
      });

      document.addEventListener("fullscreenchange", function () {
        fullscreenBtn.textContent = document.fullscreenElement ? "Tam Ekrandan Çık" : "Tam Ekran";
      });

      window.addEventListener("storage", function (event) {
        if (event.key !== STORAGE_STATE_KEY) return;
        render(readState());
      });
    })();
  </script>
</body>
</html>
